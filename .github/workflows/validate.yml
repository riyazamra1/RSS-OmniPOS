name: Repository validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate public repository scaffold
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Check required documentation
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s CONTRIBUTING.md
          test -s SECURITY.md
          test -s docs/PROJECT-OVERVIEW.md
          test -s docs/SYSTEM-ARCHITECTURE.md
          test -s docs/TECHNOLOGY-STACK.md
          test -s docs/DATABASE-ARCHITECTURE.md
          test -s docs/API-ARCHITECTURE.md
          test -s docs/OFFLINE-SYNC-ARCHITECTURE.md
          test -s docs/LICENSING-ARCHITECTURE.md
          test -s docs/DEPLOYMENT-ARCHITECTURE.md
          test -s docs/SECURITY-ARCHITECTURE.md
          test -s .github/dependabot.yml

      - name: Check for commonly named secret files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env($|\.)|id_rsa$|id_ed25519$|credentials\.json$|service-account\.json$)'; then
            echo "Potential secret file is tracked. Review before merging."
            exit 1
          fi
