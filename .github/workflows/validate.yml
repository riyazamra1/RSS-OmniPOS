name: Repository validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate public repository scaffold
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Check required documentation
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s CONTRIBUTING.md
          test -s SECURITY.md
          test -s docs/PROJECT-OVERVIEW.md
          test -s docs/SYSTEM-ARCHITECTURE.md
          test -s docs/SECURITY-ARCHITECTURE.md

      - name: Check for commonly named secret files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env($|\.)|id_rsa$|id_ed25519$|credentials\.json$|service-account\.json$)'; then
            echo "Potential secret file is tracked. Review before merging."
            exit 1
          fi
